name: Hook contract tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-tests:
    name: Hook tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Bash syntax
        shell: bash
        run: bash -n claude-code-config/.claude/hooks/*.sh
      - name: Parse Windows PowerShell 5.1 launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/launch-claude-verified.ps1').Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Out-String | Write-Error; exit 1 }
      - name: Hook regression suite
        shell: bash
        run: python -m unittest discover -s tests -v
