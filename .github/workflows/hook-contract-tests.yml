name: Hook contract tests
on:
  push:
    branches: [fix/evidence-gates-hardening]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  hook-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shell syntax
        shell: bash
        run: bash -n claude-code-config/.claude/hooks/*.sh
      - name: Hook regression suite
        shell: bash
        run: python -m unittest discover -s tests -v
