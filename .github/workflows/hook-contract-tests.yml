name: Hook contract tests

on:
  push:
    branches:
      - fix/evidence-gates-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shell syntax
        run: bash -n claude-code-config/.claude/hooks/*.sh
      - name: Run hook regression tests
        run: python3 -m unittest discover -s tests -v
